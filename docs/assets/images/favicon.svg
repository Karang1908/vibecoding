<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 72" width="100%" height="100%">
  <defs>
    <style>
      .gdg-arm {
        stroke-width: 12;
        stroke-linecap: round;
        stroke-linejoin: round;
        fill: none;
      }
    </style>
  </defs>
  <!-- Left Bracket < (Red top, Blue bottom) -->
  <path class="gdg-arm" stroke="#EA4335" d="M 45,15 L 18,36" />
  <path class="gdg-arm" stroke="#4285F4" d="M 18,36 L 45,57" />
  <!-- Right Bracket > (Green top, Yellow bottom) -->
  <path class="gdg-arm" stroke="#34A853" d="M 75,15 L 102,36" />
  <path class="gdg-arm" stroke="#FBBC05" d="M 102,36 L 75,57" />
</svg>
